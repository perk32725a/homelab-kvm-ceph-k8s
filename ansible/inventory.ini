# Lab nodes: UTM VMs on a Mac, reached by name through the Mac's /etc/hosts.
# node_ip is each node's fixed address (Ceph and k3s record it, so it must
# never change). The SSH login name comes from ~/.ssh/config.

[ceph]
node1 node_ip=192.168.65.201
node2 node_ip=192.168.65.202
node3 node_ip=192.168.65.203

[k3s_server]
node1

[k3s_agents]
node2
node3

[lab:children]
ceph
k3s_server
k3s_agents
