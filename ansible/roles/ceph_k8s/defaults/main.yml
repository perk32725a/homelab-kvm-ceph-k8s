# The lab repo's own files are the single source: the role reads them from
# the repo (no copies kept on the node) and passes them to node1 on stdin.
ceph_k8s_repo: "{{ playbook_dir }}/.."
ceph_k8s_script: "{{ ceph_k8s_repo }}/ceph/prepare-ceph.sh"
ceph_k8s_manifests:
  - "{{ ceph_k8s_repo }}/k8s/ceph-csi/rbd.yaml"
  - "{{ ceph_k8s_repo }}/k8s/ceph-csi/cephfs.yaml"

# Must match the names in prepare-ceph.sh.
ceph_k8s_rbd_pool: k8s-rbd
ceph_k8s_fs: cephfs
