k3s_version: v1.37.2+k3s1                 # pinned, so a rebuild gets what was tested
k3s_installer_url: https://get.k3s.io
k3s_server_host: "{{ groups['k3s_server'][0] }}"   # node1
k3s_url: "https://{{ k3s_server_host }}:6443"

# --disable traefik: HAProxy is the load balancer in this lab.
# --node-ip: pin each node's address; --tls-san: kubectl from the Mac uses 'node1'.
k3s_server_args: [--disable, traefik, --node-ip, "{{ node_ip }}", --tls-san, "{{ k3s_server_host }}"]
k3s_agent_args: [--node-ip, "{{ node_ip }}"]
